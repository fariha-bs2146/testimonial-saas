<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Testimonial SaaS{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
              }
            }
          }
        }
      }
    </script>
</head>
<body class="h-full flex flex-col text-slate-800">
    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-6">
                    <a href="/spaces" class="flex items-center space-x-2">
                        <span class="p-2 bg-indigo-600 text-white rounded-lg font-bold text-xl leading-none">★</span>
                        <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">KudoSpace</span>
                    </a>
                    <nav class="hidden md:flex items-center space-x-4">
                        <a href="/spaces" class="text-xs font-semibold text-slate-700 hover:text-indigo-600 transition">Spaces</a>
                        <a href="/billing" class="text-xs font-semibold text-slate-700 hover:text-indigo-600 transition">Billing &amp; Plans</a>
                    </nav>
                </div>
                <div class="flex items-center space-x-4">
                    {% if plan %}
                        {% if plan == 'pro' %}
                            <a href="/billing" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 hover:bg-emerald-200 transition">
                                <span class="w-2 h-2 mr-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Pro Plan (25 Spaces)
                            </a>
                        {% else %}
                            <a href="/billing" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-800 hover:bg-indigo-200 transition">
                                <span class="w-2 h-2 mr-1.5 rounded-full bg-indigo-500"></span> Free Plan (3 Spaces)
                            </a>
                        {% endif %}
                    {% endif %}
                    <a href="/spaces/new" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition">
                        + New Space
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        &copy; 2026 KudoSpace. Built with FastAPI, SQLite, SQLModel &amp; Tailwind CSS.
    </footer>
</body>
</html>

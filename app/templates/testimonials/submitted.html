<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! - {{ space.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8 text-center space-y-4">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">
            ✓
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900">Thank You, {{ customer_name }}!</h1>
        <p class="text-slate-600 text-sm leading-relaxed">
            Your testimonial for <span class="font-semibold text-slate-900">{{ space.name }}</span> has been submitted successfully. We truly appreciate your feedback and support!
        </p>
        <div class="pt-4 border-t border-slate-100">
            <a href="/s/{{ space.public_slug }}" class="inline-block text-xs font-semibold text-indigo-600 hover:text-indigo-800">
                &larr; Return to {{ space.name }}
            </a>
        </div>
    </div>
</body>
</html>
